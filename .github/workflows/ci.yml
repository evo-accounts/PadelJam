name: CI

# Lint, typecheck and the unit suites, on every pull request.
#
# Deliberately a HOSTED runner, unlike the E2E workflow next door: none of these
# tasks need Xcode, a simulator, or the Supabase stack, so none of the reasons
# that pin E2E to a self-hosted Mac apply here. That also means this workflow is
# safe to run on every PR — it executes the PR's code on a disposable VM, not on
# someone's laptop.
#
# The whole set takes well under a minute of actual work (test ~35s across 9
# packages, typecheck ~15s, lint ~5s), so it is a fail-fast gate rather than
# something to defer or sample.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Per-ref, and cancellable: superseded pushes to a PR are simply stale here.
  # (The E2E workflow deliberately does the opposite — it owns shared hardware.)
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # No version pinned: pnpm/action-setup reads `packageManager` from the
      # root package.json, so the lockfile and CI cannot drift apart.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `!cancelled()` on the later steps rather than fail-fast: a red lint and a
      # red test are usually independent, and seeing both in one run beats
      # fixing them one push at a time.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        if: '!cancelled()'
        run: pnpm typecheck

      # Design tokens live once, in packages/ui, and the CSS web consumes is
      # generated from them. This asserts the artifact is fresh AND that nobody
      # declared a token outside it — without that second check, a value added
      # straight to globals.css would silently desync mobile, which is exactly
      # the drift that left the two apps sharing only 3 incidental hex values.
      - name: Design tokens
        if: '!cancelled()'
        run: pnpm tokens:check

      # The one class of error with NO compiler behind it: t('missing')
      # typechecks, lints, passes the unit tests, and renders the raw key to
      # users. The E2E suite does not catch it either — it reads copy off the
      # accessibility tree, so a raw key is just a string it happily finds.
      # Two such keys slipped in during the primitive migration before this
      # existed.
      - name: i18n keys
        if: '!cancelled()'
        run: pnpm i18n:check

      # A ratchet, not a rule: 416 literal font sizes and corner radii are still
      # spread across unmigrated screens, so this holds the number and fails in
      # both directions. Lower the budget whenever a change takes screens onto
      # `Text` and the `radius` tokens. It becomes an eslint rule at zero, the
      # way the raw-colour check did.
      - name: Size budget
        if: '!cancelled()'
        run: pnpm size:check

      - name: Deployed schema matches the code the app ships
        if: '!cancelled()'
        # A missing migration on the remote is invisible to typecheck and to
        # verify-production-env: 0089 shipped to TestFlight without being applied
        # and broke every sign-in. Unreachable projects are reported, not failed.
        run: pnpm schema:check

      - name: Test
        if: '!cancelled()'
        run: pnpm test

      # Supabase Edge Functions aren't part of the pnpm workspace (they run on
      # Deno), so `pnpm test` never touches them. These are plain node --test
      # suites over pure functions (e.g. password validation) with no Supabase
      # stack dependency, so they run fine on this hosted runner.
      - name: Edge function tests
        if: '!cancelled()'
        run: pnpm test:functions
