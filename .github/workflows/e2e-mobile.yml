name: E2E (mobile)

# The iOS E2E suite needs Xcode, a simulator, idb, and Docker running the local
# Supabase stack. It runs on a SELF-HOSTED macOS runner, because a hosted one
# cannot host the stack: hosted macOS runners have no container runtime and
# cannot virtualize to add one — `colima start --vm-type=vz` returns
# VZErrorDomain Code=2 "Virtualization is not available on this hardware", and
# `kern.hv_support` does not even exist as a sysctl OID. qemu falls back to
# software emulation, which does work but took 11.5 min to boot the VM and
# 31 min to start the stack (2-3 min locally) — no use for a 13-suite nightly.
#
# That also matches the suite's own design: it owns ONE simulator and ONE local
# database exclusively (see the lock in scripts/e2e/run.mjs), which describes a
# machine, not a disposable runner.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite prefix to run (e.g. 04). Empty runs all.'
        required: false
        default: ''
  schedule:
    # WEEKLY, not nightly. The two jobs this workflow does want different
    # cadences, and running both every night served neither well:
    #
    #   "did MY change break it?"  -> the pull_request trigger below, which
    #                                 answers when you change something
    #   "did the WORLD break it?"  -> this cron
    #
    # The second is real here: the CLI is pinned below (SUPABASE_CLI_VERSION),
    # but a developer's own stack, Xcode, the simulator runtime and idb are
    # not, and the pin itself gets bumped. This project has been bitten before
    # (see the CLI ≤2.75 ES256/HS256 note in infra/supabase/config.toml).
    # Weekly catches that.
    #
    # A run also WIPES the developer's local database (resetDb rotates every
    # seeded id), so nightly was charging that cost 7× a week to answer a
    # question that changes slowly. If the Mac is asleep the job queues and
    # starts when the runner next wakes.
    - cron: '0 3 * * 0' # weekly, Sunday 03:00 UTC
  # Runs automatically on PRs that touch the code it actually exercises. The
  # paths filter is the gate now, replacing the `e2e` label: relying on someone
  # remembering to label meant main had no automated E2E at all.
  #
  # SECURITY NOTE, unchanged in substance: `pull_request` on a self-hosted runner
  # executes the PR's code on your machine. Previously only someone who could
  # label a PR could trigger that; now any PR touching these paths does. On a
  # private repo that is collaborators only — the same people who could label.
  # Revisit this if the repo ever becomes public or gains outside contributors.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'infra/**'
      - 'scripts/e2e/**'
      - '.github/workflows/e2e-mobile.yml'

concurrency:
  # SERIALISATION DOES NOT LIVE HERE, which is what the previous version of this
  # block got wrong. This Mac has ONE runner (a single Runner.Listener, so one
  # job at a time) and `run.mjs` additionally holds a machine-wide lock that
  # `--wait` queues on. Two jobs cannot touch the simulator at once whatever this
  # group says; the group only decides what gets CANCELLED.
  #
  # One global group plus cancel-in-progress therefore bought a saving at a price
  # nobody intended: a push to any PR cancelled whatever occupied the group —
  # including the WEEKLY scheduled run, which is the only thing watching for
  # Xcode, simulator, idb and CLI drift. Losing it costs a week of that signal.
  #
  # So: per BRANCH for a pull request, so the next push abandons the run it
  # supersedes; unique per run for schedule and workflow_dispatch, so nothing can
  # cancel them. Different PRs now queue on the runner instead of cancelling each
  # other, which is the correct outcome — they are asking different questions.
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('e2e-pr-{0}', github.head_ref)
        || format('e2e-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    # WHAT DECIDES WHETHER THIS RUNS. The paths filter above answers "could this
    # change affect the E2E code"; the `if:` below answers "is this PR ready to
    # spend the machine". The old comment here said there was no `if:` gate, on
    # the reasoning that gating twice only created a way to forget — which holds
    # for a gate someone has to remember to set, like the `e2e` label it
    # replaced, but not for draft status, which is already part of how a PR is
    # opened and marked ready.
    #
    # Note the paths filter is evaluated against the PR's WHOLE diff, not the
    # individual push, so once a PR has touched apps/mobile every later push
    # re-runs the suite — even one that only edits, say, a script outside these
    # paths. That is the cost the draft gate and cancel-in-progress address.
    #
    # To run the suite against something the filter excludes, use
    # workflow_dispatch (it also takes a `suite` input for a single suite).
    #
    # Swap in a dedicated label (e.g. `padeljam-e2e`) if you ever add a second
    # self-hosted macOS runner that must not pick this up.
    # A draft PR does not run the suite. 35 minutes on the one shared Mac is too
    # much to spend on every intermediate push of work still being shaped; mark
    # the PR ready (or use workflow_dispatch) when it is worth the machine.
    #
    # Spelled out rather than `github.event.pull_request.draft == false` alone,
    # because this workflow also runs on schedule and workflow_dispatch, where
    # `github.event.pull_request` does not exist and the bare comparison would
    # rest on how GitHub coerces null.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90

    env:
      # Point at Xcode without `sudo xcode-select`, which would change the
      # setting globally on someone's own machine (and need a sudo password).
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      # clean: false because this runner's workspace is persistent and the build
      # depends on two GITIGNORED trees: apps/mobile/ios (the prebuild output,
      # which is what `xcodebuild -workspace` points at, plus its Pods) and
      # apps/mobile/.e2e-derived (the Release build and the source-stamp that
      # run.mjs reads to decide whether it can skip xcodebuild). The default
      # `git clean -ffdx` deletes both, so the very first step would leave no
      # workspace to build and every later run would be a cold rebuild.
      - uses: actions/checkout@v4
        with:
          clean: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/mobile/ios is gitignored, so a workspace that has never run this
      # job has none — and run.mjs points xcodebuild straight at
      # ios/PadelJam.xcworkspace.
      #
      # Run EVERY time rather than only when the directory is absent. `clean:
      # false` above keeps the workspace between runs, so a skip meant the
      # runner kept whatever native project the first run ever generated: a
      # change to app.json or to a config plugin would never reach it. That is
      # how the Xcode 27 deployment-target fix would have been invisible here.
      # Prebuild is idempotent and takes about four seconds over an existing
      # directory, so there is nothing to save by skipping it.
      #
      # --no-install deliberately skips pod install: run.mjs installs Pods when
      # they are missing or when the Podfile has changed, using an explicit
      # /usr/local/bin/pod, and a second copy of that here would be a second
      # thing to keep in sync.
      - name: Prebuild the iOS project
        run: pnpm --filter mobile exec expo prebuild --platform ios --no-install

      # Deliberately thin: scripts/e2e/run.mjs already resolves the simulator,
      # boots it tolerating an already-booted device, and preflights the
      # Supabase API, Mailpit, Postgres and idb with actionable messages. Doing
      # any of that again here would only add a second place to keep in sync.
      - name: Ensure the local Supabase stack is up
        env:
          SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: local_test_token
          # PINNED, not @latest, so a run is reproducible and a CLI bump is a
          # commit. Keep it in step with infra/supabase/README.md and
          # apps/mobile/e2e/README.md. The pin alone does NOT fix the incident
          # below — see npm_config_cache_dir in the script.
          SUPABASE_CLI_VERSION: 2.117.0
        run: |
          # INCIDENT 2026-09-11: every run failed here with "No matching Supabase
          # CLI binary package found for darwin-arm64". pnpm caches `dlx`
          # installs under ~/Library/Caches/pnpm/dlx/<hash of the RESOLVED
          # version>, shared by every process on the machine regardless of CPU
          # arch, and reused for 24h. The developer's shell on this Mac runs an
          # Intel Homebrew Node under Rosetta (`node -p process.arch` → x64),
          # while the runner's setup-node is arm64. Whichever of the two
          # repopulates the entry first after it expires decides which
          # @supabase/cli-darwin-* optional package is in it, and the other
          # arch then fails. Pinning the version does not change the cache key
          # (supabase@2.117.0 and supabase@latest hash to the same directory),
          # so the job gets its own pnpm cache dir that no developer shell
          # writes to. It is persistent, so the CLI is downloaded once.
          export npm_config_cache_dir="$HOME/Library/Caches/pnpm-e2e-runner"
          # A no-op that prints "already running" when the developer's stack is
          # already up, which on this machine is the normal case.
          pnpm dlx "supabase@${SUPABASE_CLI_VERSION}" --workdir infra start
          # This checkout is the runner's own workspace, not the developer's
          # clone, so it starts with no .env — the seed and the suite read the
          # service-role key from the repo root.
          pnpm dlx "supabase@${SUPABASE_CLI_VERSION}" --workdir infra status -o env \
            | sed -e 's/^API_URL=/SUPABASE_URL=/' \
                  -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' \
                  -e 's/^PUBLISHABLE_KEY=/SUPABASE_ANON_KEY=/' > .env
          # The bundle inlines EXPO_PUBLIC_* at build time.
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=http://127.0.0.1:55321"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$(grep '^SUPABASE_ANON_KEY=' .env | cut -d= -f2- | tr -d '\"')"
            echo "EXPO_PUBLIC_APP_ENV=development"
          } > apps/mobile/.env

      # --wait rather than fail-fast: the developer may be running the suite by
      # hand on this same machine, and queueing behind them is friendlier than
      # a red nightly that only means "the lock was held".
      - name: Run E2E suites
        run: node scripts/e2e/run.mjs --wait ${{ inputs.suite && format('--suite {0}', inputs.suite) || '' }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: apps/mobile/e2e/artifacts/
          retention-days: 7

      # No teardown step on purpose. `supabase stop` would take down the stack
      # the developer works against, and each suite already calls resetDb() at
      # the start, so leaving it running costs nothing and surprises no one.
