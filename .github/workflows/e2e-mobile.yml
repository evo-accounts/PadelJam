name: E2E (mobile)

# The iOS E2E suite needs Xcode, a simulator, idb, and Docker running the local
# Supabase stack. It runs on a SELF-HOSTED macOS runner, because a hosted one
# cannot host the stack: hosted macOS runners have no container runtime and
# cannot virtualize to add one — `colima start --vm-type=vz` returns
# VZErrorDomain Code=2 "Virtualization is not available on this hardware", and
# `kern.hv_support` does not even exist as a sysctl OID. qemu falls back to
# software emulation, which does work but took 11.5 min to boot the VM and
# 31 min to start the stack (2-3 min locally) — no use for a 13-suite nightly.
#
# That also matches the suite's own design: it owns ONE simulator and ONE local
# database exclusively (see the lock in scripts/e2e/run.mjs), which describes a
# machine, not a disposable runner.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite prefix to run (e.g. 04). Empty runs all.'
        required: false
        default: ''
  schedule:
    # A run WIPES the local database (resetDb rotates every seeded id), so this
    # wants an hour when the machine is on but nobody is working. If the Mac is
    # asleep the job simply queues and starts when the runner next comes
    # online — which may be mid-morning, so move this if that bites.
    - cron: '0 3 * * *' # nightly, 03:00 UTC
  # NOTE: `pull_request` on a self-hosted runner executes the PR's code on your
  # machine. The `e2e` label gate below means only someone who can label a PR
  # can trigger it, which on a private repo is collaborators only — but do not
  # widen this trigger without thinking about that.
  pull_request:
    types: [labeled, synchronize]

concurrency:
  # One run at a time: the simulator and the local database are shared
  # singletons, and parallel runs corrupt each other's seeded data.
  group: e2e-mobile
  cancel-in-progress: false

jobs:
  e2e:
    # Skip label-triggered runs unless the PR actually carries the `e2e` label.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    # Swap in a dedicated label (e.g. `padeljam-e2e`) if you ever add a second
    # self-hosted macOS runner that must not pick this up.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90

    env:
      # Point at Xcode without `sudo xcode-select`, which would change the
      # setting globally on someone's own machine (and need a sudo password).
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deliberately thin: scripts/e2e/run.mjs already resolves the simulator,
      # boots it tolerating an already-booted device, and preflights the
      # Supabase API, Mailpit, Postgres and idb with actionable messages. Doing
      # any of that again here would only add a second place to keep in sync.
      - name: Ensure the local Supabase stack is up
        env:
          SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: local_test_token
        run: |
          # A no-op that prints "already running" when the developer's stack is
          # already up, which on this machine is the normal case.
          pnpm dlx supabase@latest --workdir infra start
          # This checkout is the runner's own workspace, not the developer's
          # clone, so it starts with no .env — the seed and the suite read the
          # service-role key from the repo root.
          pnpm dlx supabase@latest --workdir infra status -o env \
            | sed -e 's/^API_URL=/SUPABASE_URL=/' \
                  -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' \
                  -e 's/^PUBLISHABLE_KEY=/SUPABASE_ANON_KEY=/' > .env
          # The bundle inlines EXPO_PUBLIC_* at build time.
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=http://127.0.0.1:55321"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$(grep '^SUPABASE_ANON_KEY=' .env | cut -d= -f2- | tr -d '\"')"
            echo "EXPO_PUBLIC_APP_ENV=development"
          } > apps/mobile/.env

      # --wait rather than fail-fast: the developer may be running the suite by
      # hand on this same machine, and queueing behind them is friendlier than
      # a red nightly that only means "the lock was held".
      - name: Run E2E suites
        run: node scripts/e2e/run.mjs --wait ${{ inputs.suite && format('--suite {0}', inputs.suite) || '' }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: apps/mobile/e2e/artifacts/
          retention-days: 7

      # No teardown step on purpose. `supabase stop` would take down the stack
      # the developer works against, and each suite already calls resetDb() at
      # the start, so leaving it running costs nothing and surprises no one.
